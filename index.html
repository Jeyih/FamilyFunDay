<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>FamilyFunDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="TCT-removebg-preview.png">
</head>
<body>

<div class="ticket">
  <div class="stub-top">
    <div class="eyebrow">You're Invited </div>
    <div class="countdown" id="countdown">
      <div class="cd-unit"><div class="cd-num" id="cd-days">00</div><div class="cd-label">Days</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-hours">00</div><div class="cd-label">Hrs</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-mins">00</div><div class="cd-label">Min</div></div>
      <div class="cd-unit"><div class="cd-num" id="cd-secs">00</div><div class="cd-label">Sec</div></div>
    </div>
    <div class="cd-date" id="cdDate">October 25, 2026 &middot; 4:00 PM</div>
  </div>

  <div class="perf-wrap">
    <div class="side-notch" style="left:-11px;"></div>
    <div class="side-notch" style="right:-11px;"></div>
    <div class="perf-line"></div>
  </div>

  <div class="stub-bottom">
    <img src="FamilyFunDay.jfif">
    <h1 class="event-name" id="eventName"> </h1>
    <div class="event-sub">We hope to see you there!</div>

    <div class="btn-grid">
      <a class="btn maps" href="maps.html">
        <span><span class="icon">📍</span>Venue Location</span>
        <span class="arrow">›</span>
      </a>
      <a class="btn attire" href="attire.html">
        <span><span class="icon">👔</span>Attire and Color</span>
        <span class="arrow">›</span>
      </a>
      <a class="btn games" href="games.html">
        <span><span class="icon">🎲</span>Event Games</span>
        <span class="arrow">›</span>
      </a>
    </div>
  </div>

  <div class="id-strip">&copy;2026 Family Fun Day @Locale of Macabulos, This site is intended for the activity of Local of Macabulos</div>
</div>

<script src="config.js"></script>
<script>

// If a logo image is provided, swap the placeholder for it:
// document.getElementById('logoImg').src = "your-logo.png";
// document.getElementById('logoImg').style.display = 'block';
// document.getElementById('logoSlot').style.border = 'none';

function tick(){
  const now = new Date();
  let diff = Math.max(0, EVENT_TARGET - now);
  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60))%24);
  const m = Math.floor((diff/(1000*60))%60);
  const s = Math.floor((diff/1000)%60);
  document.getElementById('cd-days').textContent = String(d).padStart(2,'0');
  document.getElementById('cd-hours').textContent = String(h).padStart(2,'0');
  document.getElementById('cd-mins').textContent = String(m).padStart(2,'0');
  document.getElementById('cd-secs').textContent = String(s).padStart(2,'0');
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
