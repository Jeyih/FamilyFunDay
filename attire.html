<title>Attire Color</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ticket">
  <div class="page-head">
    <a class="back-btn" href="index.html">←</a>
    <div class="page-title">Attire Color</div>
  </div>
  <div class="page-body">
    <section class="attire-guide" aria-labelledby="attire-guide-title">
      <div class="attire-intro">
        <h2 id="attire-guide-title">Wear your Purok's color</h2>
      </div>
      <div class="swatch-row">
        <div class="swatch red">
          <div class="swatch-color" aria-hidden="true"><span>Purok 1</span></div>
          <div class="swatch-label">Any shade of</div>
          <div class="swatch-name">RED</div>
        </div>
        <div class="swatch blue">
          <div class="swatch-color" aria-hidden="true"><span>Purok 2</span></div>
          <div class="swatch-label">Any shade of</div>
          <div class="swatch-name">BLUE</div>
        </div>
      </div>
      <div class="white-option">
        <div class="white-swatch" aria-hidden="true"></div>
        <div>
          <span class="white-option-label">Don't have red or blue?</span>
          <strong>Please wear white instead.</strong>
        </div>
        <span class="white-check" aria-hidden="true">✓</span>
      </div>
    </section>
    <div class="attire-rules-title">A few reminders</div>
    <ul class="rules-list">
      <li><span class="rule-ok">✓</span> Please wear casual attire.</li>
      <li><span class="rule-x">✕</span> Shorts are not allowed.</li>
      <li><span class="rule-x">✕</span> Slippers and flip-flops are not allowed.</li>
    </ul>
  </div>
</div>

</body>
</html>
